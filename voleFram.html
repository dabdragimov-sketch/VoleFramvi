<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Депозит таразы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;500;700;800&family=PT+Sans:wght@400;700&family=PT+Serif:wght@700&display=swap">
<style>
/* Layout: banknote-green ground with a guilloche rosette pattern, a sticky header with separate screens (main, compare, tools, offers, about, support) switched by hash token, a shared scenario bar, and a classical bank facade drawn behind the main hero. Gold on dark green; deep green on pale mint in light theme. */
:root {
  --bg: #061d17;
  --bg-2: #0a2a21;
  --surface: #0d2b23;
  --surface-2: #133a2f;
  --ink: #e9f3ee;
  --muted: #8fb0a3;
  --line: #21493b;
  --accent: #d8b04f;
  --accent-ink: #1b1403;
  --gold: #d8b04f;
  --good: #7fdcae;
  --warn: #f0a35e;
  --s1: #d8b04f;
  --s2: #7fdcae;
  --s3: #7cc4ea;
  --font-display: "Lora", "PT Serif", Georgia, serif;
  --font-body: "Manrope", "PT Sans", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9f2ec; --bg-2: #d6e7dc; --surface: #ffffff; --surface-2: #e1eee6; --ink: #0c2a20; --muted: #4a6759; --line: #c2d6ca;
    --accent: #0f5d45; --accent-ink: #ffffff; --gold: #8a6410; --good: #146b44; --warn: #98560f;
    --s1: #0f5d45; --s2: #a77a15; --s3: #2f6f9e;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9f2ec; --bg-2: #d6e7dc; --surface: #ffffff; --surface-2: #e1eee6; --ink: #0c2a20; --muted: #4a6759; --line: #c2d6ca;
  --accent: #0f5d45; --accent-ink: #ffffff; --gold: #8a6410; --good: #146b44; --warn: #98560f;
  --s1: #0f5d45; --s2: #a77a15; --s3: #2f6f9e;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; color: var(--accent); }
.bg svg { width: 100%; height: 100%; display: block; }
.bg .fade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, transparent 0%, var(--bg) 78%); }
.wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(28px, 4.6vw, 46px); }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0; }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
a { color: var(--accent); }

/* header */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.header-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px 22px; padding-block: 10px; flex-wrap: wrap; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--ink); text-decoration: none; }
.brand svg { width: 30px; height: 30px; flex: none; }
.nav { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; }
.nav a { text-decoration: none; color: var(--muted); font-weight: 800; font-size: 14px; padding: 8px 13px; border-radius: 8px; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }
.nav a:not([aria-current="page"]):hover { color: var(--ink); background: var(--surface-2); }
.tools-r { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; font-weight: 800; color: var(--muted); background: transparent; border: 0; padding: 5px 13px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pill-btn { font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
@media (max-width: 760px) { .nav { order: 3; flex-basis: 100%; } }

.view { display: flex; flex-direction: column; gap: 22px; padding-top: 4px; }
.view[hidden] { display: none; }
.view-head { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.view-head p { color: var(--muted); max-width: 70ch; }

/* panels */
.panel { background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.sec-head p { color: var(--muted); font-size: 13.5px; }
.scn { display: grid; grid-template-columns: 1.25fr 1.35fr 1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 960px) { .scn { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .scn { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: 12.5px; font-weight: 800; color: var(--muted); letter-spacing: .02em; }
input[type="number"], input[type="text"], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 11px; min-width: 0; font-variant-numeric: tabular-nums;
}
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.unit { position: relative; }
.unit span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 14px; }
.unit input { padding-right: 34px; }
.unit.big input { font-size: 21px; font-weight: 800; padding-block: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { font: inherit; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 10px 26px; }

/* main hero */
.hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(135deg, var(--bg-2), var(--surface)); padding: clamp(18px, 3.4vw, 36px); display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 26px; align-items: center; }
.hero::after { content: ""; position: absolute; inset: 7px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 9px; pointer-events: none; }
.hero .facade { position: absolute; right: -10px; bottom: -2px; width: min(560px, 78%); color: var(--accent); opacity: .17; pointer-events: none; }
.hero > * { position: relative; }
.hero .lead { margin-top: 12px; color: var(--muted); max-width: 54ch; font-size: 15.5px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.btn { font: inherit; font-weight: 800; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 18px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.del { border-color: var(--line); color: var(--muted); background: transparent; padding: 6px 10px; font-weight: 500; }
.btn[disabled] { opacity: .5; cursor: default; }
.note { margin-top: 16px; display: flex; gap: 10px; align-items: flex-start; border: 1px dashed var(--gold); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; max-width: 60ch; background: color-mix(in srgb, var(--bg) 40%, transparent); }
.note b { color: var(--gold); white-space: nowrap; }
.kpi-card { background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.kpi-main { font-family: var(--font-display); font-size: clamp(30px, 5.2vw, 46px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi-sub { color: var(--muted); font-size: 13.5px; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi-grid div { border-top: 2px solid var(--line); padding-top: 8px; min-width: 0; }
.kpi-grid span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.kpi-grid b { font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pos { color: var(--good); }
.neg { color: var(--warn); }
.spark svg { display: block; width: 100%; height: 56px; }
@media (max-width: 880px) { .hero { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 460px) { .kpi-grid { grid-template-columns: minmax(0, 1fr); } }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .podium { grid-template-columns: minmax(0, 1fr); } }
.pod { border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--surface) 94%, transparent); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.pod .rk { font-family: var(--font-display); font-size: 30px; color: var(--gold); line-height: 1; }
.pod .nm { font-weight: 800; }
.pod .fv { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.feat a { text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--surface) 94%, transparent); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.feat a:hover { border-color: var(--accent); }
.feat svg { width: 30px; height: 30px; color: var(--accent); }
.feat p { color: var(--muted); font-size: 14px; }
.feat .go { color: var(--accent); font-weight: 800; font-size: 14px; margin-top: auto; }

/* tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 800; white-space: nowrap; }
th button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; font-weight: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button[data-on="1"] { color: var(--accent); }
td.r, th.r { text-align: right; white-space: nowrap; }
td.c, th.c { text-align: center; }
tr.top td { background: color-mix(in srgb, var(--gold) 13%, transparent); }
tr.off td { color: var(--muted); }
.bank { font-weight: 800; display: flex; flex-direction: column; gap: 5px; min-width: 140px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; font-weight: 500; }
.tag { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); white-space: nowrap; }
.tag.win { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 800; }
.tag.bad { border-color: var(--warn); color: var(--warn); }
td input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
.foot { color: var(--muted); font-size: 13px; max-width: 84ch; }
.empty { padding: 20px 6px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* chart */
svg.chart { display: block; width: 100%; height: auto; max-width: 100%; touch-action: pan-y; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.readout { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; min-height: 22px; }
.readout b { font-variant-numeric: tabular-nums; }
.readout .m { color: var(--muted); font-weight: 700; }

/* tabs */
.tablist { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tablist button { font: inherit; font-weight: 800; font-size: 14px; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 12px; margin-bottom: -1px; cursor: pointer; }
.tablist button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpanel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tabpanel[hidden] { display: none; }
.mx td.cell { text-align: right; background: color-mix(in srgb, var(--accent) calc(var(--k, 0) * 40%), transparent); }
.mx td.best { outline: 2px solid var(--gold); outline-offset: -2px; font-weight: 800; }
.mx td.dash { color: var(--muted); text-align: center; }
.goal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; align-items: end; }
.sched-wrap { max-height: 420px; overflow: auto; }
.sched-wrap thead th { position: sticky; top: 0; background: var(--surface); }
.sched-cap td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.inline .field { min-width: 170px; flex: 1; }

.msg { max-width: 88%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); overflow-wrap: anywhere; line-height: 1.55; }
.msg.a { align-self: flex-start; background: var(--surface-2); }
.msg ul { margin: 6px 0 0; padding-left: 20px; }
.msg p + p { margin-top: 8px; }
.hint { color: var(--muted); font-size: 13px; }

/* editor */
.editor td { vertical-align: middle; padding: 8px 6px; }
.editor input[type="number"], .editor input[type="text"], .editor select { padding: 6px 8px; }
.editor .w-name { min-width: 130px; }
.editor .w-rate { min-width: 78px; }
.editor .w-min { min-width: 112px; }
.editor .w-term { min-width: 58px; width: 66px; }
.editor .w-cap { min-width: 140px; }
.editor td.c input { accent-color: var(--accent); width: 18px; height: 18px; }
.disclaimer { color: var(--muted); font-size: 12.5px; max-width: 90ch; padding-top: 4px; }
.fab { position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 800; text-decoration: none; padding: 11px 18px; border-radius: 999px; border: 1px solid var(--accent); box-shadow: 0 6px 22px rgba(0,0,0,.35); }
.fab svg { width: 18px; height: 18px; }
.sup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 22px; align-items: start; }
@media (max-width: 820px) { .sup { grid-template-columns: minmax(0, 1fr); } }
.phone { font-family: var(--font-display); font-size: clamp(24px, 4vw, 32px); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.status { color: var(--good); font-weight: 800; min-height: 20px; }
.chat { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 880px; }
.log { display: flex; flex-direction: column; gap: 12px; min-height: 240px; max-height: 58vh; overflow-y: auto; padding: 4px 2px; }
.msg.u { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.compose { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.compose textarea { flex: 1; min-width: 200px; resize: vertical; min-height: 46px; max-height: 160px; }
.avatar { display: flex; align-items: center; gap: 12px; }
.avatar svg { width: 44px; height: 44px; flex: none; }
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.about-grid > div { border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--surface) 94%, transparent); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.about-grid p { color: var(--muted); font-size: 14px; }
.reports { display: flex; flex-direction: column; gap: 12px; }
.report { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.report-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; align-self: stretch; }
.report .who { font-weight: 800; font-size: 16px; }
.report .wrote, .report .when { color: var(--muted); font-size: 13px; }
.report .when { margin-left: auto; }
.report p { overflow-wrap: anywhere; white-space: pre-wrap; }
.status.neg { color: var(--bad, #c0392b); }
/* ===== motion & polish ===== */
:root { --ml: 30%; --mt: 88%; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --ml: 90%; --mt: 24%; } }
:root[data-theme="light"] { --ml: 90%; --mt: 24%; }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes drift { to { transform: translateY(-96px); } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes shine { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
@keyframes flashUp { from { background-color: color-mix(in srgb, var(--good) 42%, transparent); } to { background-color: transparent; } }
@keyframes flashDown { from { background-color: color-mix(in srgb, var(--warn) 42%, transparent); } to { background-color: transparent; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes toastIn { from { opacity: 0; transform: translateX(-24px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-24px); } }

.bg { overflow: hidden; }
.bg svg { height: calc(100% + 96px); animation: drift 50s linear infinite; }
.view:not([hidden]) { animation: viewIn .45s cubic-bezier(.2, .7, .2, 1) both; }
.hero .facade { animation: floaty 7s ease-in-out infinite; }
.hero h1 {
  background: linear-gradient(100deg, var(--ink) 38%, var(--gold) 55%, var(--ink) 72%); background-size: 240% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  animation: shine 9s ease-in-out infinite;
}
.entering .pod, .entering .feat a, .entering .bk, .entering .stat, .entering .chg-row, .entering tbody tr {
  animation: rise .55s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms);
}
.entering .spark .ln, .entering .chart .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease .15s forwards; }

.btn { position: relative; overflow: hidden; transition: transform .15s ease, box-shadow .25s ease, background .2s, color .2s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 32%, transparent); }
.btn:active { transform: translateY(0); box-shadow: none; }
.btn:not(.ghost):not(.del)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%); transform: translateX(-120%); transition: transform .6s ease; }
.btn:not(.ghost):not(.del):hover::after { transform: translateX(120%); }
.chip-btn { transition: background .2s, color .2s, border-color .2s, transform .15s; }
.chip-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.nav a { transition: background .2s, color .2s; }
.pill-btn, .seg button { transition: background .2s, color .2s; }
tbody tr { transition: background .2s; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.stat { border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--surface) 94%, transparent); padding: 16px 18px 16px 20px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }

.chg-row .arr { font-size: 14px; width: 22px; text-align: center; }

.chg-row.down .arr { color: var(--warn); }

.chg-t b { overflow-wrap: anywhere; }
.chg-t small { color: var(--muted); font-size: 12px; }
.chg-v { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }

.tag.chg { font-weight: 800; }
.tag.chg.up { border-color: var(--good); color: var(--good); }
.tag.chg.down { border-color: var(--warn); color: var(--warn); }

.pod.flash-down::after { background: color-mix(in srgb, var(--warn) 38%, transparent); }
